name: Build FiOS

on:
  push:
    branches: [arch-prathamos-lite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fios-iso:
    name: Build FiOS x86_64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out FiOS
        uses: actions/checkout@v4

      - name: Build in a current Arch Linux environment
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:latest bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed archiso base-devel cmake ninja qt6-base qt6-declarative qt6-wayland qt6-svg imagemagick
              cmake -S shell -B build-fios -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build-fios --parallel
              install -Dm755 build-fios/fios-shell distro/archiso/airootfs/usr/bin/fios-shell
              mkdir -p distro/archiso/airootfs/usr/share/fios
              magick assets/fios-wallpaper.svg -resize 1920x1080 distro/archiso/airootfs/usr/share/fios/wallpaper.png
              magick assets/fios-phi.svg -resize 220x220 distro/archiso/airootfs/usr/share/plymouth/themes/fios/phi.png
              install -Dm644 assets/fios-phi.svg distro/archiso/airootfs/usr/share/icons/hicolor/scalable/apps/fios.svg
              mkdir -p build/profile
              cp -a /usr/share/archiso/configs/releng/. build/profile/
              cp -a distro/archiso/airootfs/. build/profile/airootfs/
              cat distro/archiso/packages.x86_64 >> build/profile/packages.x86_64
              sed -i "s/^iso_name=.*/iso_name=\"fios\"/" build/profile/profiledef.sh
              sed -i "s/^iso_label=.*/iso_label=\"FIOS_$(date +%Y%m)\"/" build/profile/profiledef.sh
              sed -i "s/^iso_publisher=.*/iso_publisher=\"Pratham Tech.\"/" build/profile/profiledef.sh
              sed -i "s/^iso_application=.*/iso_application=\"FiOS Live\"/" build/profile/profiledef.sh
              for cfg in build/profile/grub/grub.cfg build/profile/efiboot/loader/entries/01-archiso-linux.conf build/profile/syslinux/archiso_sys-linux.cfg; do
                if [ -f "$cfg" ]; then sed -i "s/%KERNEL_PARAMS%/%KERNEL_PARAMS% quiet splash/g" "$cfg"; fi
              done
              chmod +x build/profile/airootfs/root/customize_airootfs.sh
              chmod +x build/profile/airootfs/usr/local/bin/fios-install
              chmod +x build/profile/airootfs/etc/xdg/labwc/autostart
              mkarchiso -v -w build/work -o /work/out build/profile
              ISO=$(find /work/out -maxdepth 1 -type f -name "*.iso" -print -quit)
              test -n "$ISO"
              mv "$ISO" /work/out/FiOS-0.1.0-x86_64.iso
              sha256sum /work/out/FiOS-0.1.0-x86_64.iso > /work/out/FiOS-0.1.0-x86_64.iso.sha256
              SIZE=$(stat -c%s /work/out/FiOS-0.1.0-x86_64.iso)
              echo "FiOS ISO bytes: $SIZE"
              xorriso -indev /work/out/FiOS-0.1.0-x86_64.iso -report_el_torito as_mkisofs
              if [ "$SIZE" -gt 2147483648 ]; then
                echo "FiOS ISO exceeds the 2 GiB target." >&2
                exit 1
              fi
            '

      - name: Upload FiOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: FiOS-0.1.0-x86_64-ISO
          path: |
            out/FiOS-0.1.0-x86_64.iso
            out/FiOS-0.1.0-x86_64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
