name: Build FiOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fios-iso:
    name: Build FiOS Arch Linux + KDE Plasma ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out FiOS
        uses: actions/checkout@v4

      - name: Build with official ArchISO tooling
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          test -s .github/scripts/build-archiso.sh
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:latest \
            bash /work/.github/scripts/build-archiso.sh

      - name: Verify ISO artifact exists
        run: |
          set -Eeuo pipefail
          test -s out/FiOS-0.1.0-x86_64.iso
          test -s out/FiOS-0.1.0-x86_64.iso.sha256
          (cd out && sha256sum --check FiOS-0.1.0-x86_64.iso.sha256)

      - name: Upload FiOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: FiOS-0.1.0-x86_64-ISO
          path: |
            out/FiOS-0.1.0-x86_64.iso
            out/FiOS-0.1.0-x86_64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
