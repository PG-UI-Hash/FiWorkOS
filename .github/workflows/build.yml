name: Build FiOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fios-iso:
    name: Build FiOS Arch Linux + KDE Plasma ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out FiOS
        uses: actions/checkout@v4

      - name: Build with official ArchISO tooling
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:latest bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed archiso imagemagick librsvg
              mkdir -p build/profile
              cp -a /usr/share/archiso/configs/releng/. build/profile/
              cp -a distro/archiso/airootfs/. build/profile/airootfs/
              cat distro/archiso/packages.x86_64 >> build/profile/packages.x86_64
              sort -u -o build/profile/packages.x86_64 build/profile/packages.x86_64

              sed -i "s/^iso_name=.*/iso_name=\\"fios\\"/" build/profile/profiledef.sh
              sed -i "s/^iso_label=.*/iso_label=\\"FIOS_$(date +%Y%m)\\"/" build/profile/profiledef.sh
              sed -i "s/^iso_publisher=.*/iso_publisher=\\"Pratham Tech.\\"/" build/profile/profiledef.sh
              sed -i "s/^iso_application=.*/iso_application=\\"FiOS Live - Arch Linux + KDE Plasma\\"/" build/profile/profiledef.sh

              for cfg in build/profile/grub/grub.cfg build/profile/efiboot/loader/entries/01-archiso-linux.conf build/profile/syslinux/archiso_sys-linux.cfg; do
                if [ -f "$cfg" ]; then sed -i "s/Arch Linux/FiOS/g;s/%KERNEL_PARAMS%/%KERNEL_PARAMS% quiet splash/g" "$cfg"; fi
              done

              mkdir -p build/profile/airootfs/usr/share/fios
              magick assets/fios-wallpaper.svg -resize 1920x1080 build/profile/airootfs/usr/share/fios/wallpaper.png
              install -Dm644 assets/fios-phi.svg build/profile/airootfs/usr/share/icons/hicolor/scalable/apps/fios.svg
              install -Dm644 assets/fios-phi.svg build/profile/airootfs/usr/share/fios/phi.svg
              mkdir -p build/profile/airootfs/usr/share/plymouth/themes/fios
              magick assets/fios-phi.svg -resize 220x220 build/profile/airootfs/usr/share/plymouth/themes/fios/phi.png
              printf "[Plymouth Theme]\\\\nName=FiOS\\\\nDescription=FiOS boot splash by Pratham Tech.\\\\nModuleName=script\\\\n\\\\n[script]\\\\nImageDir=/usr/share/plymouth/themes/fios\\\\nScriptFile=/usr/share/plymouth/themes/fios/fios.script\\\\n" > build/profile/airootfs/usr/share/plymouth/themes/fios/fios.plymouth
              printf "logo = Image(\\\\\\"phi.png\\\\\\");\\\\nlogo.SetX(Window.GetWidth() / 2 - logo.GetWidth() / 2);\\\\nlogo.SetY(Window.GetHeight() / 2 - logo.GetHeight() / 2 - 24);\\\\nmessage = Image.Text(\\\\\\"By Pratham Tech.\\\\\\", 0.8, 0.8, 0.8);\\\\nmessage.SetX(Window.GetWidth() / 2 - message.GetWidth() / 2);\\\\nmessage.SetY(Window.GetHeight() / 2 + 100);\\\\n" > build/profile/airootfs/usr/share/plymouth/themes/fios/fios.script

              chmod +x build/profile/airootfs/root/customize_airootfs.sh
              chmod +x build/profile/airootfs/usr/local/bin/fios-install
              chmod +x build/profile/airootfs/usr/share/fios/install-target.sh
              mkarchiso -v -w build/work -o /work/out build/profile

              ISO=$(find /work/out -maxdepth 1 -type f -name "*.iso" -print -quit)
              test -n "$ISO"
              mv "$ISO" /work/out/FiOS-0.1.0-x86_64.iso
              sha256sum /work/out/FiOS-0.1.0-x86_64.iso > /work/out/FiOS-0.1.0-x86_64.iso.sha256
              SIZE=$(stat -c%s /work/out/FiOS-0.1.0-x86_64.iso)
              echo "FiOS ISO bytes: $SIZE"
              xorriso -indev /work/out/FiOS-0.1.0-x86_64.iso -report_el_torito as_mkisofs
              if [ "$SIZE" -gt 2147483648 ]; then
                echo "FiOS ISO exceeds the 2 GiB target." >&2
                exit 1
              fi
            '

      - name: Upload FiOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: FiOS-0.1.0-x86_64-ISO
          path: |
            out/FiOS-0.1.0-x86_64.iso
            out/FiOS-0.1.0-x86_64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
