name: Build FiOS

on:
  push:
    branches: [main, arch-prathamos-lite]
  pull_request:
    branches: [main, arch-prathamos-lite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-iso:
    name: Build Ubuntu + KDE Plasma FiOS ISO
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out FiOS
        uses: actions/checkout@v4

      - name: Install ISO customization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools liblz4-tool python3-venv \
            python3-pip python3-debian gpg git

      - name: Download official Ubuntu 26.04.1 Desktop base
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            https://releases.ubuntu.com/26.04/ubuntu-26.04.1-desktop-amd64.iso \
            -o ubuntu-26.04.1-desktop-amd64.iso
          curl -fL --retry 5 --retry-delay 3 \
            https://releases.ubuntu.com/26.04/SHA256SUMS -o SHA256SUMS
          grep 'ubuntu-26.04.1-desktop-amd64.iso$' SHA256SUMS | sha256sum --check -

      - name: Install Ubuntu livefs editor
        run: |
          git clone --depth 1 https://github.com/ubuntu/livefs-editor.git /tmp/livefs-editor
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install /tmp/livefs-editor

      - name: Build FiOS with KDE Plasma
        env:
          LIVEFS_EDIT: ${{ github.workspace }}/.venv/bin/livefs-edit
        run: |
          chmod +x runtime/build-iso.sh
          sudo --preserve-env=GITHUB_WORKSPACE env LIVEFS_EDIT="$LIVEFS_EDIT" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" ./runtime/build-iso.sh

      - name: Validate ISO and enforce size target
        run: |
          test -s FiOS-0.1.0-amd64.iso
          xorriso -indev FiOS-0.1.0-amd64.iso -report_el_torito as_mkisofs >/dev/null
          size=$(stat -c%s FiOS-0.1.0-amd64.iso)
          echo "FiOS ISO size: $size bytes"
          if [ "$size" -gt 2147483648 ]; then
            echo "::warning::FiOS ISO exceeds the 2 GiB target."
          fi

      - name: Upload bootable FiOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: FiOS-0.1.0-amd64-ISO
          path: |
            FiOS-0.1.0-amd64.iso
            FiOS-0.1.0-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
